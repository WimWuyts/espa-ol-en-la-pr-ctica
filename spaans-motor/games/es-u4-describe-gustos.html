<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Describe los gustos</title>
<style>
/* Gedeelde ontwerptokens — azulejo-stijl (Talavera-tegels). */
:root{
  --muro:#12264A; --muro-2:#0A1730; --cal:#F3ECDB; --cal-dim:#C8BFA9;
  --barro:#D6C3A0; --barro-txt:#3A2E22; --roto:#7C7268;
  --p1:#C4402C; --p2:#E0A22F; --p3:#2E8E68; --p4:#3D74D6; --p5:#8B5E9E; --p6:#EFE7D4;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}

/* Gedeelde schil: pagina, kop, HUD, overlays, resultaten. Sjabloon-onafhankelijk. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--cal);font-family:var(--sans);
  background:
    radial-gradient(120% 80% at 18% -10%, rgba(255,236,190,.16), transparent 60%),
    radial-gradient(90% 70% at 100% 110%, rgba(61,116,214,.20), transparent 65%),
    linear-gradient(180deg,var(--muro) 0%,var(--muro-2) 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;
}
#app{width:100%;max-width:1040px}
header.mt{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
header.mt h1{font-family:var(--serif);font-weight:700;font-size:clamp(22px,4.5vw,38px);letter-spacing:.14em;margin:0;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
header.mt h1 span{color:var(--p2)}
header.mt .tag{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--cal-dim);margin:2px 0 0}
header.mt .sp{flex:1}
.mt-btn{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;background:transparent;color:var(--cal-dim);border:1px solid rgba(243,236,219,.28);border-radius:2px;padding:7px 12px;cursor:pointer;transition:.15s}
.mt-btn:hover{color:var(--cal);border-color:var(--cal);background:rgba(243,236,219,.07)}
.mt-btn:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.mt-wrap{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:start}
@media(max-width:820px){.mt-wrap{grid-template-columns:1fr}}
.mt-panel{display:flex;flex-direction:column;gap:10px}
.mt-stat{background:rgba(243,236,219,.06);border:1px solid rgba(243,236,219,.16);border-radius:2px;padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mt-stat .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cal-dim)}
.mt-stat .v{font-family:var(--mono);font-size:20px;font-weight:600}
.mt-stat .v.hot{color:var(--p2)}
@media(max-width:820px){.mt-panel{flex-direction:row;flex-wrap:wrap}.mt-stat{flex:1 1 90px}}
.mt-ov{position:fixed;inset:0;z-index:50;display:none;background:rgba(8,18,38,.90);backdrop-filter:blur(3px);overflow-y:auto;padding:24px 16px}
.mt-ov.on{display:flex;align-items:flex-start;justify-content:center}
.mt-sheet{width:100%;max-width:640px;margin:auto;background:linear-gradient(175deg,#FBF6E9,#EAE1CA);color:#12264A;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:24px;position:relative;overflow:hidden}
.mt-sheet::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(45deg,#12264A 0 5px,transparent 5px 10px),repeating-linear-gradient(-45deg,#12264A 0 5px,transparent 5px 10px);opacity:.55}
.mt-sheet h2{font-family:var(--serif);font-size:26px;letter-spacing:.08em;margin:12px 0 3px;text-transform:uppercase}
.mt-sheet .sub{font-family:var(--serif);font-style:italic;color:#6E6249;margin:0 0 18px;font-size:14.5px}
.mt-go{width:100%;margin-top:8px;padding:15px;border:none;border-radius:2px;cursor:pointer;background:#C4402C;color:#FBF6E9;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 5px 0 #8E2C1D;transition:.1s}
.mt-go:hover{background:#D14A34}.mt-go:active{transform:translateY(4px);box-shadow:0 1px 0 #8E2C1D}
.mt-go.alt{background:#12264A;box-shadow:0 5px 0 #08152C}.mt-go.alt:hover{background:#1B3667}
.mt-ghost{width:100%;margin-top:9px;padding:11px;border:1px solid #C3B99F;background:transparent;border-radius:2px;cursor:pointer;font-family:var(--serif);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6E6249}
.mt-ghost:hover{border-color:#12264A;color:#12264A}
.mt-rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mt-rcell{background:rgba(18,38,74,.07);border:1px solid rgba(18,38,74,.14);border-radius:2px;padding:9px 6px;text-align:center}
.mt-rcell .rk{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#8A7F66}
.mt-rcell .rv{font-family:var(--mono);font-size:20px;font-weight:600}
.mt-bar{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px;margin-bottom:5px;font-size:13px}
.mt-bar .bl{font-family:var(--serif);font-style:italic;text-align:right;color:#3A3222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-bar .bt{height:15px;background:rgba(18,38,74,.10);border-radius:1px;overflow:hidden}
.mt-bar .bf{height:100%;transition:width .5s ease}
.mt-bar .bn{font-family:var(--mono);font-size:11.5px;color:#6E6249}
.mt-mis{list-style:none;padding:0;margin:6px 0 0;font-size:13.5px}
.mt-mis li{padding:6px 0;border-bottom:1px dotted rgba(18,38,74,.22);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mt-mis b{font-family:var(--serif);font-size:16px}
.mt-mis .ok{color:#1F6B4C;font-weight:600}.mt-mis em{font-style:normal;color:#8E2C1D}
.mt-grp{margin-bottom:15px}
.mt-grp>label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8A7F66;margin-bottom:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Sjabloon: spreken / opname (speak). Azulejo-tegel met opnameknoppen. */
.sp-card{background:linear-gradient(175deg,#FBF6E9,#E9E0C9);border:1px solid rgba(0,0,0,.25);border-radius:3px;
  box-shadow:0 6px 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.9);padding:16px;position:relative;overflow:hidden;min-height:250px}
.sp-card::before,.sp-card::after{content:"";position:absolute;left:0;right:0;height:7px;background:repeating-linear-gradient(45deg,#12264A 0 4px,transparent 4px 8px),repeating-linear-gradient(-45deg,#12264A 0 4px,transparent 4px 8px);opacity:.5}
.sp-card::before{top:0}.sp-card::after{bottom:0}

.sp-eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A7F66;text-align:center;margin-bottom:2px}
.sp-count{font-family:var(--mono);font-size:11px;color:#B0A488;text-align:center;margin-bottom:10px}

/* stage */
.sp-stage{margin-bottom:12px}
.sp-cue{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8E2C1D;text-align:center;margin-bottom:6px}
.sp-target{font-family:var(--serif);font-weight:700;font-size:clamp(19px,3.4vw,25px);line-height:1.35;color:#12264A;text-align:center;
  background:#fff;border:1px solid #C3B99F;border-left:4px solid #1F6B4C;border-radius:4px;padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.sp-sub{font-family:var(--serif);font-style:italic;font-size:13.5px;color:#8A7F66;text-align:center;margin-top:8px}
.sp-slot{background:#FBEED0;border-bottom:2px solid #E0A22F;border-radius:3px;padding:0 5px;font-weight:700;color:#8E2C1D}
.sp-keys{color:#1F6B4C}
.sp-hidden{color:#C3B99F;letter-spacing:.35em;font-size:22px}
.sp-own{color:#8B5E9E}

/* shadowing-fasen */
.sp-phases{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.sp-phase{font-family:var(--serif);font-size:12.5px;color:#5C5540;background:#EDE4CE;border:1px solid #C3B99F;border-radius:20px;
  padding:4px 11px;cursor:pointer}
.sp-phase:hover{border-color:#12264A}
.sp-phase.on{background:#12264A;color:#F3ECDB;border-color:#12264A}

/* voicemessage-ficha */
.sp-ficha{background:#fff;border:1px solid #C3B99F;border-radius:4px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.sp-frow{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px dotted #E1D7BE}
.sp-frow:last-child{border-bottom:none}
.sp-fk{flex:0 0 82px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8A7F66}
.sp-fv{font-family:var(--serif);font-weight:700;font-size:15px;color:#12264A}
.sp-need{margin-top:10px;font-family:var(--serif);font-size:14px;color:#12264A}
.sp-needlbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8E2C1D}
.sp-need ul{margin:5px 0 0;padding-left:20px}
.sp-need li{margin:2px 0}

/* knoppen */
.sp-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.sp-btn{font-family:var(--serif);font-weight:700;font-size:14.5px;color:#fff;background:#12264A;border:none;border-radius:4px;
  padding:9px 15px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sp-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sp-btn:focus-visible{outline:3px solid #3D74D6;outline-offset:2px}
.sp-btn.listen{background:#1F6B4C}
.sp-btn.rec{background:#8E2C1D}
.sp-btn.rec.on{background:#C4402C;animation:spPulse 1.1s infinite}
.sp-btn.play{background:#3D74D6}
.sp-btn.ghost{background:#EDE4CE;color:#5C5540}
.sp-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 3px 0 rgba(0,0,0,.1)}
@keyframes spPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}

.sp-timer{text-align:center;font-family:var(--mono);font-size:12.5px;color:#8E2C1D;min-height:18px;margin-bottom:4px}
.sp-audio{width:100%;margin:6px 0;height:34px}

.sp-note{min-height:20px;text-align:center;font-family:var(--serif);font-size:13.5px;color:#5C5540;margin:6px 0 4px;line-height:1.4}
.sp-note .nl{color:#8A7F66;font-style:italic;font-size:12.5px}
.sp-note.ok{color:#1F6B4C}
.sp-note.warn{color:#8E2C1D;background:#FBEDE9;border:1px solid #E3C7C0;border-radius:4px;padding:8px 10px}
.sp-confirm{display:block;margin:8px auto 0;font-family:var(--serif);font-weight:700;font-size:14px;color:#12264A;
  background:linear-gradient(180deg,#fff,#F1E9D5);border:1px solid #C3B99F;border-radius:3px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.sp-confirm.done{background:#EAF7EE;border-color:#B7DCC4;color:#1F6B4C}

/* zelfevaluatie */
.sp-assess{margin-top:8px;padding-top:10px;border-top:1px dashed #C3B99F;text-align:center}
.sp-alabel{font-family:var(--serif);font-size:13.5px;color:#12264A;margin-bottom:8px}
.sp-alabel .nl{color:#8A7F66;font-style:italic;font-size:12.5px}
.sp-moods{display:flex;gap:10px;justify-content:center}
.sp-mood{font-size:26px;line-height:1;width:52px;height:52px;border-radius:50%;cursor:pointer;
  background:linear-gradient(180deg,#fff,#F1E9D5);border:1px solid #C3B99F;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.sp-mood:hover{border-color:#12264A;filter:brightness(1.03)}
.sp-mood:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.sp-mood:focus-visible{outline:3px solid #3D74D6;outline-offset:2px}
.sp-mood.picked{background:#EAF7EE;border-color:#1F6B4C;box-shadow:0 0 0 3px rgba(31,107,76,.25),0 3px 0 rgba(0,0,0,.14)}

</style>
</head>
<body>
<div id="app"></div>
<!-- Gegenereerd door spaans-motor uit content/es-u4-describe-gustos.json -->
<script>
/* Spreken / opname (speak): een communicatieve SPREEK-taak. De leerling
   luistert naar een model (Web Speech TTS), zegt na, NEEMT ZICHZELF OP
   (MediaRecorder, volledig offline), luistert terug en herneemt. Na elke
   opname een korte zelfevaluatie (☹/😐/☺) — deelname telt, een opname is
   nooit strikt goed/fout. Realiseert het productieve/interactieve uiteinde
   van de vaardighedenladder (§14) mét échte stemopname.

   Modi via cfg.speak.mode:
   - "repeat"       : luister → zeg na → neem op → herbeluister → herneem.
   - "shadowing"    : idem, met afbouwende fasen (tekst → sleutelwoorden → geen tekst → eigen versie).
   - "substitution" : één modelzin met wisselende bouwstenen (carrusel).
   - "voicemessage" : ontvanger·situatie·doel + verplichte bouwstenen → één spraakbericht.

   Content (cfg.speak):
     mode, prompt?, phases?(shadowing), frame?(substitution),
     items:[ … ] (velden verschillen per modus, zie schema.md ).

   Robuust: als de micro niet beschikbaar is (of geweigerd) blijft de TTS +
   een ☑-bevestiging werken (print/offline-fallback). Nooit crashen; streams
   worden opgeruimd in api._cleanup. */
window.MotorTemplates = window.MotorTemplates || {};
window.MotorTemplates.speak = {
  init(api){
    const cfg = api.config, el = api.el;
    const conf = cfg.speak || {};
    const mode = conf.mode || "repeat";
    const items = (conf.items || []).slice();
    api.setTarget(items.length);

    const DEF_PHASES = ["Texto completo","Palabras clave","Sin texto","Tu versión"];
    const phases = (conf.phases && conf.phases.length ? conf.phases : DEF_PHASES);

    /* ---- schil ---- */
    const root = api.root; root.innerHTML = "";
    const card = el("div","sp-card");
    card.innerHTML =
      '<div class="sp-eye" id="spEye"></div>'+
      '<div class="sp-count" id="spCount"></div>'+
      '<div class="sp-stage" id="spStage"></div>'+
      '<div class="sp-controls" id="spCtl">'+
        '<button class="sp-btn listen" id="spListen" type="button">▶ Escuchar</button>'+
        '<button class="sp-btn rec" id="spRec" type="button">⏺ Grabar</button>'+
        '<button class="sp-btn play" id="spPlay" type="button" disabled>▶ Mi grabación</button>'+
        '<button class="sp-btn ghost" id="spAgain" type="button" disabled>↻ Otra vez</button>'+
      '</div>'+
      '<div class="sp-timer" id="spTimer">&nbsp;</div>'+
      '<audio class="sp-audio" id="spAudio" controls hidden></audio>'+
      '<div class="sp-note" id="spNote"></div>'+
      '<div class="sp-assess" id="spAssess">'+
        '<div class="sp-alabel">¿Cómo ha ido? · <span class="nl">hoe ging het?</span></div>'+
        '<div class="sp-moods">'+
          '<button class="sp-mood" data-m="0" type="button" title="cuesta un poco">☹</button>'+
          '<button class="sp-mood" data-m="1" type="button" title="más o menos">😐</button>'+
          '<button class="sp-mood" data-m="2" type="button" title="¡bien!">☺</button>'+
        '</div>'+
      '</div>';
    root.appendChild(card);

    const eyeEl   = card.querySelector("#spEye");
    const countEl = card.querySelector("#spCount");
    const stageEl = card.querySelector("#spStage");
    const bListen = card.querySelector("#spListen");
    const bRec    = card.querySelector("#spRec");
    const bPlay   = card.querySelector("#spPlay");
    const bAgain  = card.querySelector("#spAgain");
    const timerEl = card.querySelector("#spTimer");
    const audioEl = card.querySelector("#spAudio");
    const noteEl  = card.querySelector("#spNote");
    const moods   = card.querySelectorAll(".sp-mood");

    eyeEl.textContent = conf.prompt || "Escucha · repite · grábate";

    /* ---- media-staat ---- */
    const mediaOK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== "undefined");
    let stream=null, rec=null, chunks=[], blobUrl=null, recording=false, hasRec=false, timerId=null, t0=0, micDead=!mediaOK;

    async function ensureStream(){
      if(stream) return stream;
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      return stream;
    }
    function fmt(ms){ const s=Math.floor(ms/1000); return (s<10?"0":"")+s+"s"; }
    function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
    function stopRecording(){
      if(rec && recording){ try{ rec.stop(); }catch(e){} }
      recording=false; stopTimer();
      bRec.classList.remove("on"); bRec.textContent="⏺ Grabar";
    }

    async function startRecording(){
      if(!mediaOK){ micFallback(); return; }
      try{ await ensureStream(); }
      catch(e){ micFallback(); return; }
      chunks=[]; hasRec=false;
      try{ rec = new MediaRecorder(stream); }
      catch(e){ micFallback(); return; }
      rec.ondataavailable = ev => { if(ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = () => {
        if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl=null; }
        if(chunks.length){
          const blob = new Blob(chunks, {type: chunks[0].type || "audio/webm"});
          blobUrl = URL.createObjectURL(blob);
          audioEl.src = blobUrl; audioEl.hidden=false;
          bPlay.disabled=false; bAgain.disabled=false; hasRec=true;
          note("¡Grabado! Escúchate y compara con el modelo. <span class='nl'>opgenomen — luister terug en vergelijk.</span>", "ok");
        }
      };
      rec.start(); recording=true; t0=Date.now();
      bRec.classList.add("on"); bRec.textContent="⏹ Parar";
      timerEl.textContent="● grabando… 00s";
      stopTimer();
      timerId=setInterval(()=>{ timerEl.textContent="● grabando… "+fmt(Date.now()-t0); }, 250);
      note("Habla ahora. Pulsa ⏹ Parar cuando termines. <span class='nl'>spreek nu; klik ⏹ om te stoppen.</span>", "");
    }

    bRec.addEventListener("click", ()=>{
      if(recording){ stopRecording(); timerEl.innerHTML="&nbsp;"; }
      else { startRecording(); }
    });
    bPlay.addEventListener("click", ()=>{
      if(blobUrl){ audioEl.currentTime=0; audioEl.play().catch(()=>{}); }
    });
    bAgain.addEventListener("click", ()=>{ resetRec(); note("Otra vez: escucha el modelo y grábate de nuevo. <span class='nl'>opnieuw opnemen.</span>",""); });

    function micFallback(){
      micDead=true;
      recording=false; stopTimer(); timerEl.innerHTML="&nbsp;";
      bRec.classList.remove("on"); bRec.textContent="⏺ Grabar";
      note("🎙️ Micrófono no disponible — usa Chrome/Edge y permite el micrófono. "+
           "<span class='nl'>Geen micro? Beluister het model en oefen hardop, y confirma abajo.</span>", "warn");
      /* fallback-knop: hardop geoefend zonder opname */
      if(!noteEl.querySelector(".sp-confirm")){
        const b = el("button","sp-confirm","☑ Lo he practicado en voz alta");
        b.type="button";
        b.addEventListener("click", ()=>{ b.classList.add("done"); b.textContent="☑ ¡hecho!"; hasRec=true; api.sfx.move(); });
        noteEl.appendChild(b);
      }
    }
    function note(html, kind){
      noteEl.className = "sp-note" + (kind?(" "+kind):"");
      noteEl.innerHTML = html || "";
    }
    function resetRec(){
      stopRecording();
      if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl=null; }
      audioEl.pause(); audioEl.removeAttribute("src"); audioEl.hidden=true;
      bPlay.disabled=true; bAgain.disabled=true; hasRec=false;
      timerEl.innerHTML="&nbsp;";
      const c=card.querySelector(".sp-confirm"); if(c) c.remove();
    }

    /* ---- TTS ---- */
    function speak(text){
      if(!("speechSynthesis" in window) || !text){
        note("🔊 Lee el modelo en voz alta. <span class='nl'>geen TTS in deze browser — lees hardop.</span>","");
        return;
      }
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang="es-ES"; u.rate=0.95;
        speechSynthesis.speak(u);
      }catch(e){}
    }

    /* ---- huidig item ---- */
    let idx=0, item=null, phase=0;

    function speakText(){
      if(mode==="substitution") return composed(item);
      if(mode==="voicemessage") return item.model || "";
      return item.text || "";
    }
    function composed(it){
      const fr = conf.frame || "{}";
      const fills = (it.fills||[]).slice();
      let i=0;
      return fr.replace(/___|\{\}/g, ()=> (i<fills.length ? fills[i++] : "…"));
    }

    /* ---- stage per modus ---- */
    function renderStage(){
      stageEl.className="sp-stage m-"+mode;
      if(mode==="repeat"){
        stageEl.innerHTML =
          (item.cue?'<div class="sp-cue">'+esc(item.cue)+'</div>':'')+
          '<div class="sp-target">'+esc(item.text)+'</div>'+
          (item.sub?'<div class="sp-sub">'+esc(item.sub)+'</div>':'');
        bListen.style.display="";
      } else if(mode==="shadowing"){
        stageEl.innerHTML =
          '<div class="sp-phases" id="spPhases"></div>'+
          '<div class="sp-target" id="spShadow"></div>'+
          (item.sub?'<div class="sp-sub">'+esc(item.sub)+'</div>':'');
        const ph = stageEl.querySelector("#spPhases");
        phases.forEach((p,i)=>{
          const b=el("button","sp-phase"+(i===phase?" on":""), esc(p)); b.type="button";
          b.addEventListener("click",()=>{ phase=i; paintPhases(); renderShadow(); });
          ph.appendChild(b);
        });
        renderShadow();
        bListen.style.display="";
      } else if(mode==="substitution"){
        stageEl.innerHTML =
          '<div class="sp-cue">'+esc(conf.frameLabel||"Modelo")+'</div>'+
          '<div class="sp-target">'+frameHtml(item)+'</div>'+
          (item.sub?'<div class="sp-sub">'+esc(item.sub)+'</div>':'');
        bListen.style.display="";
      } else if(mode==="voicemessage"){
        const blocks = (item.blocks||[]).map(b=>'<li>'+esc(b)+'</li>').join("");
        stageEl.innerHTML =
          '<div class="sp-ficha">'+
            '<div class="sp-frow"><span class="sp-fk">Para</span><span class="sp-fv">'+esc(item.to||"")+'</span></div>'+
            '<div class="sp-frow"><span class="sp-fk">Situación</span><span class="sp-fv">'+esc(item.situation||"")+'</span></div>'+
            '<div class="sp-frow"><span class="sp-fk">Objetivo</span><span class="sp-fv">'+esc(item.goal||"")+'</span></div>'+
          '</div>'+
          (blocks?'<div class="sp-need"><span class="sp-needlbl">Incluye:</span><ul>'+blocks+'</ul></div>':'')+
          (item.sub?'<div class="sp-sub">'+esc(item.sub)+'</div>':'');
        bListen.style.display = item.model ? "" : "none";
      } else {
        stageEl.innerHTML='<div class="sp-target">'+esc(item.text||"")+'</div>';
        bListen.style.display="";
      }
    }
    function paintPhases(){
      stageEl.querySelectorAll(".sp-phase").forEach((b,i)=>b.classList.toggle("on",i===phase));
    }
    function renderShadow(){
      const t = stageEl.querySelector("#spShadow"); if(!t) return;
      const words = String(item.text||"").split(/\s+/);
      if(phase===0){ t.innerHTML = esc(item.text); }
      else if(phase===1){
        const keys = (item.keywords && item.keywords.length)
          ? item.keywords
          : words.filter(w=>w.replace(/[.,¡!¿?]/g,"").length>4);
        t.innerHTML = '<span class="sp-keys">'+keys.map(esc).join(" · ")+'</span>';
      }
      else if(phase===2){ t.innerHTML = '<span class="sp-hidden">'+words.map(()=>"•").join(" ")+'</span>'; }
      else { t.innerHTML = '<span class="sp-own">Di tu propia versión →</span>'; }
    }
    function frameHtml(it){
      const fr = conf.frame || "{}";
      const fills = (it.fills||[]).slice();
      let i=0, out="";
      const parts = fr.split(/___|\{\}/);
      parts.forEach((p,j)=>{
        out += esc(p);
        if(j < parts.length-1){
          const f = i<fills.length ? fills[i++] : "…";
          out += '<span class="sp-slot">'+esc(f)+'</span>';
        }
      });
      return out;
    }

    /* ---- laden / vooruit ---- */
    function load(){
      if(idx >= items.length){ api.finish(); return; }
      item = items[idx]; phase=0;
      countEl.textContent = (idx+1)+" / "+items.length;
      resetRec();
      moods.forEach(b=>b.classList.remove("picked"));
      renderStage();
      if(micDead){ micFallback(); }
      else { note("Escucha ▶, repite y luego grábate ⏺. <span class='nl'>luister, zeg na, neem jezelf op.</span>",""); }
    }
    bListen.addEventListener("click", ()=>{ speak(speakText()); });

    moods.forEach(b=>{
      b.addEventListener("click", ()=>{
        moods.forEach(x=>x.classList.remove("picked"));
        b.classList.add("picked");
        const m = +b.dataset.m;
        // reflectie-tip afhankelijk van zelfscore
        const tip = m>=2
          ? (item.tip || "¡Bien! Grábalo otra vez más rápido y sin mirar. <span class='nl'>nog eens, sneller en zonder te kijken.</span>")
          : "Escucha el modelo de nuevo, fíjate en el ritmo y vuelve a grabarte. <span class='nl'>beluister het model opnieuw, let op ritme, en herneem.</span>";
        note(tip, m>=2?"ok":"");
        api.judge(true, {tag:item.tag || mode, stimulus:speakText() || item.goal || item.to || "opname"});
        api.tick();
        setTimeout(()=>{ idx++; load(); }, api.calm?250:700);
      });
    });

    /* ---- opruimen ---- */
    api._cleanup = function(){
      stopRecording();
      stopTimer();
      if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream=null; }
      if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl=null; }
      try{ audioEl.pause(); }catch(e){}
      if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); }catch(e){} }
    };

    // micDead → load() toont automatisch de vriendelijke melding + fallback-knop
    load();

    function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  }
};

/* ============================================================
   MOTOR — gedeelde kern. Sjabloon-onafhankelijk.
   Een sjabloon rendert ALLEEN het speelveld en meldt per beurt
   goed/fout via api.judge(). De motor doet de rest:
   score, streak, niveau, adaptieve keuze, foutenlog, resultaten,
   geluid, instellingen, toegankelijkheid.
   ============================================================ */
(function(){
"use strict";

const CALM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- geluid ---------- */
function makeAudio(on){
  let AC=null;
  function ac(){ if(!AC && on){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
  function beep(f,d,type,vol,to){ if(!on)return; const a=ac(); if(!a)return;
    const o=a.createOscillator(),g=a.createGain(); o.type=type||"triangle";
    o.frequency.setValueAtTime(f,a.currentTime);
    if(to) o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
    g.gain.setValueAtTime(vol||.16,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+d);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d); }
  function noise(d,vol){ if(!on)return; const a=ac(); if(!a)return;
    const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);
    for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource();s.buffer=buf;
    const fl=a.createBiquadFilter();fl.type="lowpass";fl.frequency.value=900;
    const g=a.createGain();g.gain.value=vol||.18;
    s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(); }
  return {
    unlock:ac,
    setOn(v){on=v;},
    ok(){ beep(740,.08,"triangle",.16); setTimeout(()=>beep(1108,.13,"triangle",.14),60); },
    bad(){ noise(.22,.24); beep(150,.28,"sawtooth",.12,70); },
    move(){ beep(620,.04,"square",.05); },
    win(){ [523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>beep(f,.16,"triangle",.15),i*62)); }
  };
}

/* ---------- helpers ---------- */
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function shade(hex,f){ const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,Math.round(((n>>16)&255)*f)));
  const g=Math.max(0,Math.min(255,Math.round(((n>>8)&255)*f)));
  const b=Math.max(0,Math.min(255,Math.round((n&255)*f)));
  return "rgb("+r+","+g+","+b+")"; }

/* ---------- adaptieve toevoer ----------
   Trekt K kandidaten en kiest die met de zwakste tag. Werkt zowel voor
   generatoren (source.make) als voor vaste itemlijsten (source.items). */
function makeFeeder(source, tagStats){
  const draw = source.make ? source.make
             : () => source.items[(Math.random()*source.items.length)|0];
  return function next(){
    let best=null, bestScore=Infinity;
    for(let i=0;i<4;i++){
      const it = draw();
      const st = tagStats[it.tag] || {ok:0,bad:0};
      const acc = (st.ok+1)/(st.ok+st.bad+2);      // laag = zwak → voorrang
      const score = acc + Math.random()*0.5;
      if(score<bestScore){ bestScore=score; best=it; }
    }
    return best;
  };
}

/* ============================================================
   MOUNT
   ============================================================ */
function mount(app, cfg){
  cfg.options = cfg.options || {};
  const audio = makeAudio(cfg.options.audio !== false);

  /* ---- schil bouwen ---- */
  app.innerHTML = "";
  const header = el("header","mt");
  const titleWrap = el("div");
  titleWrap.appendChild(el("h1",null, esc(cfg.title||"Oefening")));
  if(cfg.subtitle) titleWrap.appendChild(el("p","tag", esc(cfg.subtitle)));
  header.appendChild(titleWrap);
  header.appendChild(el("div","sp"));
  const bAgain = el("button","mt-btn","Opnieuw"); bAgain.type="button";
  header.appendChild(bAgain);
  app.appendChild(header);

  const wrap = el("div","mt-wrap");
  const fieldCol = el("div");
  const field = el("div","mt-field");
  fieldCol.appendChild(field);
  wrap.appendChild(fieldCol);

  const panel = el("div","mt-panel");
  const sScore = statBox(panel,"Punten","0");
  const sStreak = statBox(panel,"Reeks","0");
  const sProg = statBox(panel,"Voortgang","–");
  wrap.appendChild(panel);
  app.appendChild(wrap);

  /* ---- resultatenoverlay ---- */
  const ov = el("div","mt-ov");
  ov.innerHTML =
    '<div class="mt-sheet"><h2>Klaar</h2><p class="sub" id="mtRSub"></p>'+
    '<div class="mt-rgrid">'+
      '<div class="mt-rcell"><div class="rk">Punten</div><div class="rv" id="mtRScore">0</div></div>'+
      '<div class="mt-rcell"><div class="rk">Juist</div><div class="rv" id="mtRAcc">–</div></div>'+
      '<div class="mt-rcell"><div class="rk">Beste reeks</div><div class="rv" id="mtRBest">0</div></div>'+
    '</div>'+
    '<div class="mt-grp" id="mtRBarsWrap"><label id="mtRBarsLbl">Per categorie</label><div id="mtRBars"></div></div>'+
    '<div class="mt-grp" id="mtRMisWrap"><label>Waar het misging</label><ul class="mt-mis" id="mtRMis"></ul></div>'+
    '<button class="mt-go" id="mtRAgain" type="button">Opnieuw</button></div>';
  app.appendChild(ov);

  /* ---- staat ---- */
  const S = { score:0, streak:0, best:0, level:1, ok:0, total:0, tagStats:{}, log:[], done:0, target:0 };

  function statBox(parent,k,v){
    const b=el("div","mt-stat"); b.innerHTML='<span class="k">'+k+'</span><span class="v">'+v+'</span>';
    parent.appendChild(b); return b.querySelector(".v");
  }
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function hud(){
    sScore.textContent=S.score;
    sStreak.textContent=S.streak; sStreak.classList.toggle("hot",S.streak>=5);
    sProg.textContent = S.target ? (S.done+"/"+S.target) : "–";
  }

  /* label voor een tag (categorie of persoon) t.b.v. resultaten */
  function tagLabel(tag){
    if(cfg._tagLabel){ const l=cfg._tagLabel(tag); if(l) return l; }
    if(cfg.classify && cfg.classify.categories){
      const c=cfg.classify.categories.find(x=>x.id===tag); if(c) return c.label.replace(/<[^>]+>/g," ").trim();
    }
    return tag;
  }

  /* ---- API voor het sjabloon ---- */
  const feeder = cfg._source ? makeFeeder(cfg._source, S.tagStats) : null;

  const api = {
    root: field,
    config: cfg,
    calm: CALM,
    sfx: audio,
    el, shade,
    categories: (cfg.classify && cfg.classify.categories) || [],

    /* volgende stimulus (adaptief) — enkel voor stimulus→antwoord-sjablonen */
    next(){ return feeder ? feeder() : null; },

    /* aantal beurten instellen (voor voortgang + einde) */
    setTarget(n){ S.target=n; hud(); },
    tick(){ S.done++; hud(); },

    /* losse puntenbonus (bv. tetris-lijn); telt niet mee in juist% */
    bonus(n){ S.score += (n|0); hud(); },

    /* kern: één beoordeling. meta = {tag, stimulus, chosen, correct[], sub} */
    judge(ok, meta){
      meta = meta || {};
      S.total++;
      const tag = meta.tag || "_";
      const st = S.tagStats[tag] || (S.tagStats[tag]={ok:0,bad:0});
      if(ok){
        S.ok++; st.ok++; S.streak++; if(S.streak>S.best)S.best=S.streak;
        S.score += 10 + Math.min(50,S.streak*3);
        if(S.ok % 10 === 0) S.level++;
        audio.ok();
      }else{
        st.bad++; S.streak=0; S.score=Math.max(0,S.score-5);
        audio.bad();
        if(meta.stimulus){
          S.log.push({ stimulus:meta.stimulus, sub:meta.sub||"",
            juist:(meta.correct||[]).map(tagLabel).join(" / "),
            gekozen: meta.chosen!=null ? tagLabel(meta.chosen) : "" });
        }
      }
      hud();
      return { ok, streak:S.streak };
    },

    finish(){ showResults(); }
  };

  function showResults(){
    const acc = S.total ? Math.round(S.ok/S.total*100) : 0;
    ov.querySelector("#mtRScore").textContent=S.score;
    ov.querySelector("#mtRAcc").textContent=acc+"%";
    ov.querySelector("#mtRBest").textContent=S.best;
    ov.querySelector("#mtRSub").textContent =
      acc>=90 ? "Strak werk." : acc>=70 ? "Degelijk." : "Nog eens oefenen loont.";

    /* balken per tag (alleen tonen als er >1 tag is) */
    const tags = Object.keys(S.tagStats);
    const barsWrap = ov.querySelector("#mtRBarsWrap");
    const bars = ov.querySelector("#mtRBars"); bars.innerHTML="";
    if(tags.length>1){
      barsWrap.style.display="";
      const palette=["#C4402C","#E0A22F","#2E8E68","#3D74D6","#8B5E9E","#6E6249"];
      tags.forEach((t,i)=>{
        const s=S.tagStats[t], tot=s.ok+s.bad, pct=tot?Math.round(s.ok/tot*100):0;
        const row=el("div","mt-bar");
        row.innerHTML='<span class="bl">'+esc(tagLabel(t))+'</span>'+
          '<span class="bt"><span class="bf" style="width:'+pct+'%;background:'+palette[i%palette.length]+'"></span></span>'+
          '<span class="bn">'+pct+'%</span>';
        bars.appendChild(row);
      });
    } else barsWrap.style.display="none";

    /* laatste fouten */
    const misWrap=ov.querySelector("#mtRMisWrap");
    const ul=ov.querySelector("#mtRMis"); ul.innerHTML="";
    const last=S.log.slice(-8).reverse();
    misWrap.style.display = last.length ? "" : "none";
    last.forEach(m=>{
      const li=el("li");
      li.innerHTML="<b>"+esc(m.stimulus)+"</b> <span class='ok'>"+esc(m.juist)+"</span>"+
        (m.gekozen?" <em>jij: "+esc(m.gekozen)+"</em>":"")+
        (m.sub?" <span style='color:#8A7F66;font-size:12px'>("+esc(m.sub)+")</span>":"");
      ul.appendChild(li);
    });
    if(acc>=90) audio.win();
    ov.classList.add("on");
  }

  /* ---- start / herstart ---- */
  function reset(){
    S.score=0;S.streak=0;S.best=0;S.level=1;S.ok=0;S.total=0;S.tagStats={};S.log=[];S.done=0;S.target=0;
    if(api._cleanup){ api._cleanup(); api._cleanup=null; }
    ov.classList.remove("on"); field.innerHTML=""; hud();
    const tpl = window.MotorTemplates && window.MotorTemplates[cfg.template];
    if(!tpl){ field.innerHTML="<p style='color:#C4402C'>Onbekend sjabloon: "+esc(cfg.template)+"</p>"; return; }
    tpl.init(api);
  }
  bAgain.addEventListener("click", ()=>{ audio.unlock(); reset(); });
  ov.querySelector("#mtRAgain").addEventListener("click", ()=>{ audio.unlock(); reset(); });

  /* eerste tik ontgrendelt geluid op mobiel */
  app.addEventListener("pointerdown", ()=>audio.unlock(), {once:true});

  reset();
}

window.Motor = { mount };
})();
