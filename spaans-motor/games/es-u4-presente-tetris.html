<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presente regular</title>
<style>
/* Gedeelde ontwerptokens — azulejo-stijl (Talavera-tegels). */
:root{
  --muro:#12264A; --muro-2:#0A1730; --cal:#F3ECDB; --cal-dim:#C8BFA9;
  --barro:#D6C3A0; --barro-txt:#3A2E22; --roto:#7C7268;
  --p1:#C4402C; --p2:#E0A22F; --p3:#2E8E68; --p4:#3D74D6; --p5:#8B5E9E; --p6:#EFE7D4;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}

/* Gedeelde schil: pagina, kop, HUD, overlays, resultaten. Sjabloon-onafhankelijk. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--cal);font-family:var(--sans);
  background:
    radial-gradient(120% 80% at 18% -10%, rgba(255,236,190,.16), transparent 60%),
    radial-gradient(90% 70% at 100% 110%, rgba(61,116,214,.20), transparent 65%),
    linear-gradient(180deg,var(--muro) 0%,var(--muro-2) 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;
}
#app{width:100%;max-width:1040px}
header.mt{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
header.mt h1{font-family:var(--serif);font-weight:700;font-size:clamp(22px,4.5vw,38px);letter-spacing:.14em;margin:0;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
header.mt h1 span{color:var(--p2)}
header.mt .tag{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--cal-dim);margin:2px 0 0}
header.mt .sp{flex:1}
.mt-btn{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;background:transparent;color:var(--cal-dim);border:1px solid rgba(243,236,219,.28);border-radius:2px;padding:7px 12px;cursor:pointer;transition:.15s}
.mt-btn:hover{color:var(--cal);border-color:var(--cal);background:rgba(243,236,219,.07)}
.mt-btn:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.mt-btn.bet.on{color:#12264A;background:linear-gradient(180deg,#E0A22F,#C4842A);border-color:#E0A22F;font-weight:700}
.mt-wrap{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:start}
@media(max-width:820px){.mt-wrap{grid-template-columns:1fr}}
.mt-panel{display:flex;flex-direction:column;gap:10px}
.mt-stat{background:rgba(243,236,219,.06);border:1px solid rgba(243,236,219,.16);border-radius:2px;padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mt-stat .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cal-dim)}
.mt-stat .v{font-family:var(--mono);font-size:20px;font-weight:600}
.mt-stat .v.hot{color:var(--p2)}
@media(max-width:820px){.mt-panel{flex-direction:row;flex-wrap:wrap}.mt-stat{flex:1 1 90px}}
.mt-ov{position:fixed;inset:0;z-index:50;display:none;background:rgba(8,18,38,.90);backdrop-filter:blur(3px);overflow-y:auto;padding:24px 16px}
.mt-ov.on{display:flex;align-items:flex-start;justify-content:center}
.mt-sheet{width:100%;max-width:640px;margin:auto;background:linear-gradient(175deg,#FBF6E9,#EAE1CA);color:#12264A;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:24px;position:relative;overflow:hidden}
.mt-sheet::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(45deg,#12264A 0 5px,transparent 5px 10px),repeating-linear-gradient(-45deg,#12264A 0 5px,transparent 5px 10px);opacity:.55}
.mt-sheet h2{font-family:var(--serif);font-size:26px;letter-spacing:.08em;margin:12px 0 3px;text-transform:uppercase}
.mt-sheet .sub{font-family:var(--serif);font-style:italic;color:#6E6249;margin:0 0 18px;font-size:14.5px}
.mt-go{width:100%;margin-top:8px;padding:15px;border:none;border-radius:2px;cursor:pointer;background:#C4402C;color:#FBF6E9;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 5px 0 #8E2C1D;transition:.1s}
.mt-go:hover{background:#D14A34}.mt-go:active{transform:translateY(4px);box-shadow:0 1px 0 #8E2C1D}
.mt-go.alt{background:#12264A;box-shadow:0 5px 0 #08152C}.mt-go.alt:hover{background:#1B3667}
.mt-ghost{width:100%;margin-top:9px;padding:11px;border:1px solid #C3B99F;background:transparent;border-radius:2px;cursor:pointer;font-family:var(--serif);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6E6249}
.mt-ghost:hover{border-color:#12264A;color:#12264A}
.mt-rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mt-rcell{background:rgba(18,38,74,.07);border:1px solid rgba(18,38,74,.14);border-radius:2px;padding:9px 6px;text-align:center}
.mt-rcell .rk{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#8A7F66}
.mt-rcell .rv{font-family:var(--mono);font-size:20px;font-weight:600}
.mt-bar{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px;margin-bottom:5px;font-size:13px}
.mt-bar .bl{font-family:var(--serif);font-style:italic;text-align:right;color:#3A3222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-bar .bt{height:15px;background:rgba(18,38,74,.10);border-radius:1px;overflow:hidden}
.mt-bar .bf{height:100%;transition:width .5s ease}
.mt-bar .bn{font-family:var(--mono);font-size:11.5px;color:#6E6249}
.mt-mis{list-style:none;padding:0;margin:6px 0 0;font-size:13.5px}
.mt-mis li{padding:6px 0;border-bottom:1px dotted rgba(18,38,74,.22);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mt-mis b{font-family:var(--serif);font-size:16px}
.mt-mis .ok{color:#1F6B4C;font-weight:600}.mt-mis em{font-style:normal;color:#8E2C1D}
.mt-grp{margin-bottom:15px}
.mt-grp>label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8A7F66;margin-bottom:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Motor-features — meta-laag widgets (streak · heatmap · can-do). */
.mf-panel{background:linear-gradient(175deg,#FBF6E9,#E9E0C9);border:1px solid rgba(0,0,0,.2);border-radius:3px;
  box-shadow:0 4px 0 rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.85);padding:14px 16px}
.mf-h{font-family:var(--serif);font-weight:700;font-size:16px;color:#12264A;margin-bottom:10px}
.mf-nl,.mf-h .mf-nl{font-family:var(--sans);font-weight:400;font-style:italic;font-size:12px;color:#8A7F66}
.mf-fire{filter:saturate(1.2)}
.mf-empty{font-family:var(--serif);font-style:italic;color:#8A7F66;font-size:14px}

/* streak-kalender */
.mf-cal{display:flex;gap:4px;flex-wrap:wrap}
.mf-day{display:flex;flex-direction:column;align-items:center;gap:3px;width:30px}
.mf-day i{width:22px;height:22px;border-radius:5px;background:#E1D6BC;border:1px solid #C3B99F;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.mf-day.on i{background:linear-gradient(180deg,#3E9E77,#2E8E68);border-color:#1F6B4C;box-shadow:0 0 6px rgba(46,142,104,.5)}
.mf-day.today i{outline:2px solid #E0A22F;outline-offset:1px}
.mf-day em{font-family:var(--mono);font-size:8px;color:#8A7F66;font-style:normal}

/* heatmap */
.mf-hrow{display:flex;align-items:center;gap:8px;margin:5px 0}
.mf-hl{flex:0 0 40%;font-family:var(--serif);font-size:13px;color:#3A2E22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-ht{flex:1;height:12px;border-radius:99px;background:#E1D6BC;overflow:hidden;border:1px solid #C3B99F}
.mf-hf{display:block;height:100%;border-radius:99px;transition:width .4s}
.mf-hn{flex:0 0 34px;text-align:right;font-family:var(--mono);font-size:11px;color:#6E6249}

/* can-do */
.mf-cando{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mf-cbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  font-family:var(--serif);font-size:14px;color:#12264A;padding:8px 10px;border-radius:2px;
  background:linear-gradient(180deg,#fff,#F3ECDB);border:1px solid #C3B99F;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.mf-cbox{flex:0 0 22px;height:22px;border-radius:4px;border:2px solid #C3B99F;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#2E8E68;font-size:14px}
.mf-ci.on .mf-cbtn{background:linear-gradient(180deg,#EAF7EE,#DFF3E4);border-color:#9FCDB4}
.mf-ci.on .mf-cbox{border-color:#2E8E68;background:#DFF3E4}
.mf-cbtn:active{transform:translateY(1px)}

/* Sjabloon: tetris (sorteer-faller). Kolommen = categorieën. De vallende
   tegel toont de stimulus; laat ze in de juiste kolom vallen. Volle rij = weg. */
.tx-wrap{max-width:min(94vw,480px);margin:0 auto}
.tx-head{display:grid;gap:4px;margin-bottom:6px}
.tx-h{font-family:var(--serif);font-weight:700;text-align:center;padding:8px 4px;border-radius:2px 2px 0 0;cursor:pointer;
  color:#FBF6E9;line-height:1.1;font-size:clamp(13px,3.2vw,17px);border:1px solid rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);user-select:none;transition:filter .1s}
.tx-h small{display:block;font-family:var(--mono);font-size:9px;font-weight:400;opacity:.7;margin-top:2px}
.tx-h:hover{filter:brightness(1.12)}.tx-h:active{filter:brightness(1.25)}
.tx-h.ink-d{color:#16233D}

.tx-grid{position:relative;display:grid;gap:4px;background:rgba(8,18,38,.55);border:1px solid rgba(243,236,219,.22);border-radius:0 0 3px 3px;padding:4px;overflow:hidden;touch-action:manipulation}
.tx-cell{--ch:46px;height:var(--ch);border-radius:2px;background:rgba(243,236,219,.05)}
@media(max-width:520px){.tx-cell{--ch:40px}}
.tx-cell.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tx-cell.crack{position:relative}
.tx-cell.crack::after{content:"";position:absolute;inset:0;background:
  linear-gradient(45deg,transparent 46%,rgba(20,10,6,.6) 47% 49%,transparent 50%),
  linear-gradient(-20deg,transparent 60%,rgba(20,10,6,.5) 61% 63%,transparent 64%);}
.tx-cell.clear{animation:txFlash .28s}
@keyframes txFlash{0%{filter:brightness(2.4)}100%{}}

.tx-active{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:2px;background:linear-gradient(175deg,#FBF6E9,#E7DEC7);color:#12264A;font-family:var(--serif);font-weight:700;
  border:1px solid rgba(0,0,0,.3);box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8);
  padding:2px 4px;line-height:1.02;word-break:break-word;transition:left .11s linear,top .11s linear;z-index:3}
.tx-meta{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 0;font-size:12px;color:var(--cal-dim)}
.tx-meta .m{font-family:var(--mono)}
.tx-sub{text-align:center;font-family:var(--serif);font-style:italic;color:var(--cal-dim);min-height:20px;margin-top:4px;font-size:14px}
.tx-tip{text-align:center;font-size:11.5px;letter-spacing:.06em;color:var(--roto);margin-top:6px}

</style>
</head>
<body>
<div id="app"></div>
<!-- Gegenereerd door spaans-motor uit content/es-u4-presente-tetris.json -->
<script>
/* Geverifieerde Spaanse dataset. Wordt bij de build ingelijmd in elk spel
   dat een generator gebruikt. Werkwoorden: onregelmatige vormen expliciet
   uitgeschreven, regelmatige via de vervoegingsmotor. */
window.MotorData = window.MotorData || {};
window.MotorData.es = {
  verbs: [
    /* regelmatig -ar */
    {i:"hablar",n:"spreken"},{i:"trabajar",n:"werken"},{i:"estudiar",n:"studeren"},
    {i:"escuchar",n:"luisteren"},{i:"comprar",n:"kopen"},{i:"bailar",n:"dansen"},
    {i:"cantar",n:"zingen"},{i:"viajar",n:"reizen"},{i:"tomar",n:"nemen, drinken"},
    {i:"mirar",n:"kijken"},{i:"llamar",n:"bellen, noemen"},{i:"cocinar",n:"koken"},
    {i:"descansar",n:"rusten"},{i:"nadar",n:"zwemmen"},{i:"visitar",n:"bezoeken"},
    {i:"ayudar",n:"helpen"},{i:"llevar",n:"dragen, meenemen"},{i:"necesitar",n:"nodig hebben"},
    {i:"esperar",n:"wachten, hopen"},{i:"caminar",n:"wandelen"},{i:"desayunar",n:"ontbijten"},
    {i:"cenar",n:"avondeten eten"},{i:"terminar",n:"eindigen"},{i:"llegar",n:"aankomen"},
    {i:"buscar",n:"zoeken"},{i:"pagar",n:"betalen"},{i:"practicar",n:"oefenen"},
    /* regelmatig -er */
    {i:"comer",n:"eten"},{i:"beber",n:"drinken"},{i:"aprender",n:"leren"},
    {i:"correr",n:"lopen, rennen"},{i:"vender",n:"verkopen"},{i:"comprender",n:"begrijpen"},
    {i:"responder",n:"antwoorden"},
    /* regelmatig -ir */
    {i:"vivir",n:"wonen, leven"},{i:"subir",n:"omhooggaan"},{i:"recibir",n:"ontvangen"},
    {i:"decidir",n:"beslissen"},{i:"compartir",n:"delen"},
    /* onregelmatig */
    {i:"ser",n:"zijn",pres:["soy","eres","es","somos","sois","son"],indef:["fui","fuiste","fue","fuimos","fuisteis","fueron"],imperf:["era","eras","era","éramos","erais","eran"]},
    {i:"estar",n:"zijn (toestand)",pres:["estoy","estás","está","estamos","estáis","están"],indef:["estuve","estuviste","estuvo","estuvimos","estuvisteis","estuvieron"]},
    {i:"ir",n:"gaan",pres:["voy","vas","va","vamos","vais","van"],indef:["fui","fuiste","fue","fuimos","fuisteis","fueron"],imperf:["iba","ibas","iba","íbamos","ibais","iban"]},
    {i:"tener",n:"hebben",pres:["tengo","tienes","tiene","tenemos","tenéis","tienen"],indef:["tuve","tuviste","tuvo","tuvimos","tuvisteis","tuvieron"],fs:"tendr"},
    {i:"hacer",n:"doen, maken",pres:["hago","haces","hace","hacemos","hacéis","hacen"],indef:["hice","hiciste","hizo","hicimos","hicisteis","hicieron"],fs:"har",part:"hecho"},
    {i:"poder",n:"kunnen",pres:["puedo","puedes","puede","podemos","podéis","pueden"],indef:["pude","pudiste","pudo","pudimos","pudisteis","pudieron"],fs:"podr"},
    {i:"querer",n:"willen, houden van",pres:["quiero","quieres","quiere","queremos","queréis","quieren"],indef:["quise","quisiste","quiso","quisimos","quisisteis","quisieron"],fs:"querr"},
    {i:"venir",n:"komen",pres:["vengo","vienes","viene","venimos","venís","vienen"],indef:["vine","viniste","vino","vinimos","vinisteis","vinieron"],fs:"vendr"},
    {i:"decir",n:"zeggen",pres:["digo","dices","dice","decimos","decís","dicen"],indef:["dije","dijiste","dijo","dijimos","dijisteis","dijeron"],fs:"dir",part:"dicho"},
    {i:"poner",n:"zetten, leggen",pres:["pongo","pones","pone","ponemos","ponéis","ponen"],indef:["puse","pusiste","puso","pusimos","pusisteis","pusieron"],fs:"pondr",part:"puesto"},
    {i:"salir",n:"buitengaan, vertrekken",pres:["salgo","sales","sale","salimos","salís","salen"],fs:"saldr"},
    {i:"saber",n:"weten, kunnen",pres:["sé","sabes","sabe","sabemos","sabéis","saben"],indef:["supe","supiste","supo","supimos","supisteis","supieron"],fs:"sabr"},
    {i:"dar",n:"geven",pres:["doy","das","da","damos","dais","dan"],indef:["di","diste","dio","dimos","disteis","dieron"]},
    {i:"ver",n:"zien",pres:["veo","ves","ve","vemos","veis","ven"],indef:["vi","viste","vio","vimos","visteis","vieron"],imperf:["veía","veías","veía","veíamos","veíais","veían"],part:"visto"},
    {i:"conocer",n:"kennen",pres:["conozco","conoces","conoce","conocemos","conocéis","conocen"]},
    {i:"jugar",n:"spelen",pres:["juego","juegas","juega","jugamos","jugáis","juegan"]},
    {i:"dormir",n:"slapen",pres:["duermo","duermes","duerme","dormimos","dormís","duermen"],indef:["dormí","dormiste","durmió","dormimos","dormisteis","durmieron"]},
    {i:"pedir",n:"vragen, bestellen",pres:["pido","pides","pide","pedimos","pedís","piden"],indef:["pedí","pediste","pidió","pedimos","pedisteis","pidieron"]},
    {i:"empezar",n:"beginnen",pres:["empiezo","empiezas","empieza","empezamos","empezáis","empiezan"]},
    {i:"volver",n:"terugkeren",pres:["vuelvo","vuelves","vuelve","volvemos","volvéis","vuelven"],part:"vuelto"},
    {i:"pensar",n:"denken",pres:["pienso","piensas","piensa","pensamos","pensáis","piensan"]},
    {i:"entender",n:"begrijpen",pres:["entiendo","entiendes","entiende","entendemos","entendéis","entienden"]},
    {i:"preferir",n:"liever hebben",pres:["prefiero","prefieres","prefiere","preferimos","preferís","prefieren"],indef:["preferí","preferiste","prefirió","preferimos","preferisteis","prefirieron"]},
    {i:"cerrar",n:"sluiten",pres:["cierro","cierras","cierra","cerramos","cerráis","cierran"]},
    {i:"encontrar",n:"vinden, tegenkomen",pres:["encuentro","encuentras","encuentra","encontramos","encontráis","encuentran"]},
    {i:"sentir",n:"voelen, spijtig vinden",pres:["siento","sientes","siente","sentimos","sentís","sienten"],indef:["sentí","sentiste","sintió","sentimos","sentisteis","sintieron"]},
    {i:"seguir",n:"volgen, verdergaan",pres:["sigo","sigues","sigue","seguimos","seguís","siguen"],indef:["seguí","seguiste","siguió","seguimos","seguisteis","siguieron"]},
    {i:"oír",n:"horen",pres:["oigo","oyes","oye","oímos","oís","oyen"],indef:["oí","oíste","oyó","oímos","oísteis","oyeron"],fs:"oir",fsReg:true},
    {i:"traer",n:"brengen",pres:["traigo","traes","trae","traemos","traéis","traen"],indef:["traje","trajiste","trajo","trajimos","trajisteis","trajeron"]},
    {i:"leer",n:"lezen",indef:["leí","leíste","leyó","leímos","leísteis","leyeron"]},
    {i:"escribir",n:"schrijven",part:"escrito"},
    {i:"abrir",n:"openen",part:"abierto"}
  ],
  /* Zelfstandige naamwoorden met lidwoord. m/f, incl. valstrikken. */
  nouns: [
    {w:"casa",g:"f",n:"huis"},{w:"libro",g:"m",n:"boek"},{w:"mesa",g:"f",n:"tafel"},
    {w:"perro",g:"m",n:"hond"},{w:"ciudad",g:"f",n:"stad"},{w:"coche",g:"m",n:"auto"},
    {w:"escuela",g:"f",n:"school"},{w:"amigo",g:"m",n:"vriend"},{w:"ventana",g:"f",n:"raam"},
    {w:"teléfono",g:"m",n:"telefoon"},{w:"puerta",g:"f",n:"deur"},{w:"gato",g:"m",n:"kat"},
    {w:"silla",g:"f",n:"stoel"},{w:"hermano",g:"m",n:"broer"},{w:"familia",g:"f",n:"gezin"},
    {w:"trabajo",g:"m",n:"werk"},{w:"comida",g:"f",n:"eten"},{w:"país",g:"m",n:"land"},
    {w:"universidad",g:"f",n:"universiteit"},{w:"pan",g:"m",n:"brood"},{w:"leche",g:"f",n:"melk"},
    {w:"árbol",g:"m",n:"boom"},{w:"flor",g:"f",n:"bloem"},{w:"sol",g:"m",n:"zon"},
    /* valstrikken op -a/-o */
    {w:"problema",g:"m",n:"probleem",trap:true},{w:"día",g:"m",n:"dag",trap:true},
    {w:"mapa",g:"m",n:"kaart",trap:true},{w:"programa",g:"m",n:"programma",trap:true},
    {w:"idioma",g:"m",n:"taal",trap:true},{w:"clima",g:"m",n:"klimaat",trap:true},
    {w:"mano",g:"f",n:"hand",trap:true},{w:"foto",g:"f",n:"foto",trap:true},
    {w:"moto",g:"f",n:"motor",trap:true},
    /* -ción / -dad zijn f */
    {w:"canción",g:"f",n:"lied"},{w:"estación",g:"f",n:"station"},
    {w:"habitación",g:"f",n:"kamer"},{w:"verdad",g:"f",n:"waarheid"}
  ]
};

;
/* Generatoren — leveren geverifieerde items aan de sjablonen.
   Elke generator geeft { make(): item, tagLabel(tag): string }.
   Een item = { stimulus, answer, tag, sub }.
   answer mag een array zijn (meerdere juiste categorieën, bv. yo=él bij imperfecto).
   Taalkundige juistheid komt HIER vandaan, nooit uit vrije generatie. */
window.MotorGen = window.MotorGen || {};

/* ---------- vervoegingsmotor (nagerekend) ---------- */
(function(){
  function stripAcc(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
  const vtype = inf => stripAcc(inf.slice(-2));
  const vstem = inf => inf.slice(0,-2);
  const END = {
    pres:{ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]},
    indef:{ar:["é","aste","ó","amos","asteis","aron"],er:["í","iste","ió","imos","isteis","ieron"],ir:["í","iste","ió","imos","isteis","ieron"]},
    imperf:{ar:["aba","abas","aba","ábamos","abais","aban"],er:["ía","ías","ía","íamos","íais","ían"],ir:["ía","ías","ía","íamos","íais","ían"]},
    fut:["é","ás","á","emos","éis","án"],
    cond:["ía","ías","ía","íamos","íais","ían"]
  };
  const HABER=["he","has","ha","hemos","habéis","han"];
  function participio(v){
    if(v.part) return v.part;
    const t=vtype(v.i),s=vstem(v.i);
    if(t==="ar") return s+"ado";
    return /[aeo]$/.test(s)?s+"ído":s+"ido";
  }
  function conjugate(v,tense){
    if(tense==="perf"){const p=participio(v);return HABER.map(h=>h+" "+p);}
    if(v[tense]) return v[tense].slice();
    const t=vtype(v.i),s=vstem(v.i);
    if(tense==="fut"||tense==="cond"){const base=v.fs||v.i;return END[tense].map(e=>base+e);}
    const out=END[tense][t].map(e=>s+e);
    if(tense==="indef"&&t==="ar"){
      if(/c$/.test(s)) out[0]=s.slice(0,-1)+"qué";
      else if(/g$/.test(s)) out[0]=s+"ué";
      else if(/z$/.test(s)) out[0]=s.slice(0,-1)+"cé";
    }
    return out;
  }
  function isIrregular(v,tense){
    if(tense==="perf") return !!v.part;
    if(tense==="fut"||tense==="cond") return !!v.fs && !v.fsReg;
    return !!v[tense];
  }
  const PERS=["yo","tu","el","nos","vos","ellos"];
  const IDX={yo:0,tu:1,el:2,nos:3,vos:4,ellos:5};
  const MIX=["pres","indef","imperf","fut"];

  window.MotorGen.conjugation = function(opts){
    opts = opts || {};
    const persons = (opts.persons||PERS).map(p=>IDX[p]);
    const verbs = window.MotorData.es.verbs.filter(v=>{
      const t = opts.tense==="mix" ? "pres" : opts.tense;
      const irr = isIrregular(v,t);
      if(opts.pool==="reg") return !irr;
      if(opts.pool==="irr") return irr;
      return true;
    });
    function make(){
      let tense = opts.tense==="mix" ? MIX[(Math.random()*MIX.length)|0] : opts.tense;
      let pool = verbs;
      if(!pool.length){ pool = window.MotorData.es.verbs; }
      const v = pool[(Math.random()*pool.length)|0];
      const forms = conjugate(v,tense);
      const pick = persons[(Math.random()*persons.length)|0];
      const form = forms[pick];
      // alle personen (binnen de actieve set) met dezelfde vorm = allemaal juist
      const ans = [];
      persons.forEach(pi=>{ if(forms[pi]===form) ans.push(PERS[pi]); });
      return { stimulus:form, answer:ans, tag:PERS[pick], sub:v.i+" · "+v.n };
    }
    return { make, tagLabel:t=>t };
  };
})();

/* ---------- geslacht van zelfstandige naamwoorden ---------- */
window.MotorGen.gender = function(opts){
  opts = opts || {};
  const nouns = window.MotorData.es.nouns.filter(x=> opts.trapsOnly ? x.trap : true);
  function make(){
    const x = nouns[(Math.random()*nouns.length)|0];
    return { stimulus:"___ "+x.w, answer:x.g, tag:x.g, sub:x.n };
  }
  return { make, tagLabel:t=> t==="m" ? "masculino" : "femenino" };
};

/* ---------- werkwoordengenerator (presente) ----------
   Voedt alle tien de spelideeën. Modi:
     "person" → welke persoon hoort bij deze vorm  (classify / tetris)
     "clase"  → welke presente-klasse heeft dit werkwoord (classify / tetris)
   opts.classes filtert de werkwoorden (bv. ["ie","ue","i","uue"] = enkel cambio vocálico).
   Presente wordt nagerekend; expliciete onregelmatige vormen krijgen voorrang. */
(function(){
  const PERS=["yo","tu","el","nos","vos","ellos"];
  const IDX={yo:0,tu:1,el:2,nos:3,vos:4,ellos:5};
  function repl(s,f,t){ const i=s.lastIndexOf(f); return i<0?s:s.slice(0,i)+t+s.slice(i+1); }
  function strongStem(stem,c){
    if(!c||c==="reg") return stem;
    if(c==="ie") return repl(stem,"e","ie");
    if(c==="ue") return repl(stem,"o","ue");
    if(c==="i")  return repl(stem,"e","i");
    if(c==="uue")return repl(stem,"u","ue");
    if(c==="ie2")return repl(stem,"i","ie");
    if(c==="hue")return repl(stem,"o","hue");
    return stem;
  }
  function presente(v){
    if(v.pres) return v.pres.slice();
    const t=v.i.slice(-2), stem=v.i.slice(0,-2);
    const E = t==="ar"?["o","as","a","amos","áis","an"]
            : t==="er"?["o","es","e","emos","éis","en"]
            :          ["o","es","e","imos","ís","en"];
    const strong=strongStem(stem,v.c);
    const uir=v.o==="uir";
    const f=[];
    for(let p=0;p<6;p++){
      const stressed=!(p===3||p===4);
      let s = stressed?strong:stem;
      if(uir) s = stressed? stem+"y" : stem;
      f.push(s+E[p]);
    }
    // yo-vorm
    if(v.yo){ f[0]=v.yo; }
    else if(v.o){
      const b=(v.c&&v.c!=="reg")?strong:stem;
      if(v.o==="ger")  f[0]=b.replace(/g$/,"j")+"o";
      else if(v.o==="zco") f[0]=b.replace(/c$/,"zc")+"o";
      else if(v.o==="zo")  f[0]=b.replace(/c$/,"z")+"o";
      else if(v.o==="guir")f[0]=b.replace(/gu$/,"g")+"o";
      /* uir: yo is al 'stem+y+o' uit de lus */
    }
    return f;
  }
  function clase(v){
    if(v.c==="ie") return "ie";
    if(v.c==="ue") return "ue";
    if(v.c==="i")  return "i";
    if(v.c==="uue")return "uue";
    if(v.pres||v.yo||v.irr||v.c==="ie2"||v.c==="hue") return "irr";
    return "reg";
  }

  function pool(opts){
    const all=window.MotorData.esVerbos;
    if(opts && opts.classes && opts.classes.length){
      const set=new Set(opts.classes);
      return all.filter(v=>set.has(clase(v)));
    }
    return all;
  }

  window.MotorGen.verbo = function(opts){
    opts=opts||{}; const mode=opts.mode||"person";
    const verbs=pool(opts);
    const persons=(opts.persons||PERS).map(p=>IDX[p]);

    function makePerson(){
      const v=verbs[(Math.random()*verbs.length)|0];
      const forms=presente(v);
      const pick=persons[(Math.random()*persons.length)|0];
      const form=forms[pick];
      const ans=[]; persons.forEach(pi=>{ if(forms[pi]===form) ans.push(PERS[pi]); });
      return { stimulus:form, answer:ans, tag:PERS[pick], sub:v.i+" · "+v.n };
    }
    function makeClase(){
      const v=verbs[(Math.random()*verbs.length)|0];
      const k=clase(v);
      return { stimulus:v.i, answer:k, tag:k, sub:v.n };
    }
    const CL={reg:"regular",ie:"e→ie",ue:"o→ue",i:"e→i",uue:"u→ue",irr:"onregelmatig"};
    return {
      make: mode==="clase"?makeClase:makePerson,
      tagLabel: t => mode==="clase" ? (CL[t]||t) : t
    };
  };

  /* helpers voor toekomstige sjablonen (intruso, paradigma, cloze, memoria) */
  window.MotorGen.verboConjugar = presente;
  window.MotorGen.verboClase = clase;
})();

/* Tetris-sjabloon: sorteer-faller. Kolommen = categorieën uit cfg.classify.
   Stimulus valt; stuur ze naar de juiste kolom (tik kolom / pijltjes / 1-9).
   Juist = schone tegel; fout = gebarsten tegel (vult je bord). Volle rij = weg.
   Bord vol → einde. Hergebruikt ELK classify-pakket, ook met generator. */
window.MotorTemplates = window.MotorTemplates || {};
window.MotorTemplates.tetris = {
  init(api){
    const cfg=api.config, el=api.el, shade=api.shade;
    const cats=(cfg.classify&&cfg.classify.categories)||[];
    const COLS=cats.length, ROWS=(cfg.options&&cfg.options.rows)||9;
    const START=(cfg.options&&cfg.options.speed)||1050;
    const root=api.root; root.innerHTML="";

    const wrap=el("div","tx-wrap");
    const head=el("div","tx-head"); head.style.gridTemplateColumns="repeat("+COLS+",1fr)";
    cats.forEach((c,i)=>{
      const h=el("div","tx-h"); h.dataset.col=i;
      h.style.background="linear-gradient(180deg,"+shade(c.glaze,1.12)+","+shade(c.glaze,.84)+")";
      if(isLight(c.glaze)) h.classList.add("ink-d");
      h.innerHTML=c.label+(i<9?"<small>"+(i+1)+"</small>":"");
      h.addEventListener("click",()=>drop(i));
      head.appendChild(h);
    });
    const grid=el("div","tx-grid"); grid.style.gridTemplateColumns="repeat("+COLS+",1fr)";
    const cells=[];
    for(let i=0;i<ROWS*COLS;i++){ const c=el("div","tx-cell"); grid.appendChild(c); cells.push(c); }
    const active=el("div","tx-active"); active.style.display="none"; grid.appendChild(active);
    const sub=el("div","tx-sub","&nbsp;");
    const meta=el("div","tx-meta"); meta.innerHTML='<span>Lijnen <b class="m" id="txL">0</b></span><span>Niveau <b class="m" id="txN">1</b></span>';
    const tip=el("div","tx-tip","tik de kolom · of pijltjes + spatie · of 1–"+Math.min(COLS,9));
    wrap.appendChild(head); wrap.appendChild(grid); wrap.appendChild(meta); wrap.appendChild(sub); wrap.appendChild(tip);
    root.appendChild(wrap);

    /* staat */
    const board=Array.from({length:ROWS},()=>new Array(COLS).fill(null));
    const height=new Array(COLS).fill(0);
    let cur=null, lines=0, drops=0, over=false, timer=null, cw=0, chh=0;

    function measure(){ const c0=cells[0].getBoundingClientRect(), g=grid.getBoundingClientRect();
      cw=cells[1]?(cells[1].getBoundingClientRect().left-c0.left):c0.width+4;
      chh=(cells[COLS]?(cells[COLS].getBoundingClientRect().top-c0.top):c0.height+4);
      active.style.width=c0.width+"px"; active.style.height=c0.height+"px";
      active.style.fontSize=Math.max(10,Math.min(20, (c0.width*1.7)/Math.max(4,curLen())))+"px";
    }
    function curLen(){ return cur? String(cur.item.stimulus).length : 6; }
    function place(){ if(!cur){active.style.display="none";return;}
      const base=cells[0].getBoundingClientRect(), g=grid.getBoundingClientRect();
      const x=(cells[cur.col].getBoundingClientRect().left)-g.left+grid.clientLeft;
      const r=cur.row<0?0:cur.row;
      const y=(cells[r*COLS+cur.col].getBoundingClientRect().top)-g.top+grid.clientTop + (cur.row<0?-chh:0);
      active.style.left=x+"px"; active.style.top=y+"px"; active.style.display="flex";
    }
    function paint(){
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const cell=cells[r*COLS+c], b=board[r][c];
        cell.className="tx-cell";
        if(b){ cell.classList.add("on"); if(!b.ok)cell.classList.add("crack");
          cell.style.background="linear-gradient(180deg,"+shade(b.glaze,1.1)+","+shade(b.glaze,.82)+")"; }
        else cell.style.background="";
      }
    }
    function floor(col){ return ROWS-1-height[col]; }

    function spawn(){
      if(over) return;
      cur={ col:(COLS>>1), row:-1, item:api.next() };
      active.textContent=cur.item.stimulus;
      sub.innerHTML = (cfg.options&&cfg.options.hint===false)?"&nbsp;":(cur.item.sub?esc(cur.item.sub):"&nbsp;");
      measure(); place();
    }
    function step(){
      if(over||!cur) return;
      const fr=floor(cur.col);
      if(cur.row>=fr){ lock(); return; }
      cur.row++; place();
    }
    function moveCol(d){ if(over||!cur)return; const n=cur.col+d; if(n>=0&&n<COLS){cur.col=n;place();} }
    function drop(col){ if(over||!cur)return; if(col!=null)cur.col=col; cur.row=floor(cur.col); place(); lock(); }

    function lock(){
      const col=cur.col, fr=floor(col);
      if(fr<0){ end(); return; }
      const ans=Array.isArray(cur.item.answer)?cur.item.answer:[cur.item.answer];
      const ok=ans.indexOf(cats[col].id)>=0;
      board[fr][col]={glaze:cats[col].glaze, ok}; height[col]++;
      api.judge(ok,{tag:cur.item.tag,stimulus:cur.item.stimulus,chosen:cats[col].id,correct:ans,sub:cur.item.sub});
      cur=null; active.style.display="none";
      paint(); clearLines(); drops++;
      if(height.some(h=>h>=ROWS)){ end(); return; }
      retime();
      setTimeout(spawn, 70);
    }
    function clearLines(){
      let cleared=0;
      for(let r=ROWS-1;r>=0;r--){
        let full=true; for(let c=0;c<COLS;c++) if(!board[r][c]){full=false;break;}
        if(full){ cleared++;
          for(let c=0;c<COLS;c++) cells[r*COLS+c].classList.add("clear");
          for(let rr=r; rr>0; rr--) board[rr]=board[rr-1].slice();
          board[0]=new Array(COLS).fill(null); r++;
        }
      }
      if(cleared){
        for(let c=0;c<COLS;c++){ let h=0; for(let r=0;r<ROWS;r++) if(board[r][c])h++; height[c]=h; }
        lines+=cleared; document.getElementById("txL").textContent=lines;
        api.bonus(cleared*cleared*25); api.sfx.win();
        setTimeout(paint, 120);
      }
    }
    function level(){ return 1+Math.floor(drops/8); }
    function retime(){ const n=level(); document.getElementById("txN").textContent=n;
      clearInterval(timer); timer=setInterval(step, Math.max(340, START - (n-1)*80)); }
    function end(){ over=true; clearInterval(timer); api.finish(); }

    function onKey(e){
      if(over||!cur) return;
      if(e.key==="ArrowLeft"){e.preventDefault();moveCol(-1);}
      else if(e.key==="ArrowRight"){e.preventDefault();moveCol(1);}
      else if(e.key===" "||e.key==="ArrowDown"){e.preventDefault();drop(null);}
      else if(e.key>="1"&&e.key<="9"){const i=+e.key-1; if(i<COLS){e.preventDefault();drop(i);}}
    }
    document.addEventListener("keydown",onKey);
    grid.addEventListener("click",e=>{ if(!cur)return; const g=grid.getBoundingClientRect();
      const i=Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-g.left)/(g.width/COLS)))); drop(i); });
    const onResize=()=>{ measure(); place(); };
    window.addEventListener("resize",onResize);
    api._cleanup=()=>{ clearInterval(timer); document.removeEventListener("keydown",onKey); window.removeEventListener("resize",onResize); };

    paint();
    requestAnimationFrame(()=>{ spawn(); retime(); });

    function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
    function isLight(hex){ const n=parseInt(hex.slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))>176; }
  }
};

;
/* ============================================================
   MOTOR-FEATURES — meta-laag (plan §4-D). Eén keer bouwen, overal inzetbaar.
   Volledig offline, dependency-vrij, veilig als localStorage ontbreekt.

   Bevat:
   - Store          : persistente voortgang (dagen, tags, spellen, can-do)
   - recordFinish() : de engine roept dit aan op het einde van elk spel
   - mountStreak()  : streak-kalender-widget (speel elke dag)
   - mountHeatmap() : fouten-/beheersings-heatmap per tag
   - mountCanDo()   : zelfscan met can-do-uitspraken (persistent)
   - Leitner        : spaced-repetition doosjes (1-5) voor een itempool
   ============================================================ */
(function(){
"use strict";
var KEY="motor:v1";

function today(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return "0000-00-00"; } }
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
function save(d){
  try{ localStorage.setItem(KEY, JSON.stringify(d)); return true; }catch(e){ return false; }
}
function base(d){
  d.days=d.days||{}; d.tags=d.tags||{}; d.games=d.games||{}; d.cando=d.cando||{}; d.leitner=d.leitner||{};
  return d;
}

/* --- de engine roept dit aan bij showResults --- */
function recordFinish(sum){
  try{
    sum=sum||{};
    var d=base(load()), t=today();
    var day=d.days[t]||(d.days[t]={plays:0,ok:0,total:0});
    day.plays++; day.ok+=(sum.ok|0); day.total+=(sum.total|0);
    var ts=sum.tagStats||{}, tl=sum.tagLabels||{};
    for(var tag in ts){ if(!ts.hasOwnProperty(tag)) continue;
      var g=d.tags[tag]||(d.tags[tag]={ok:0,bad:0});
      g.ok+=(ts[tag].ok|0); g.bad+=(ts[tag].bad|0);
      if(tl[tag]) g.label=tl[tag];
    }
    if(sum.id){
      var acc=sum.total? Math.round(sum.ok/sum.total*100):0;
      var ge=d.games[sum.id]||(d.games[sum.id]={plays:0,best:0,last:0});
      ge.plays++; ge.last=acc; if(acc>ge.best) ge.best=acc; if(sum.title) ge.title=sum.title;
    }
    save(d);
  }catch(e){}
}

/* --- streak: opeenvolgende dagen met minstens één spel, eindigend vandaag --- */
function streakCount(days){
  var n=0, dt;
  try{ dt=new Date(today()+"T00:00:00"); }catch(e){ return 0; }
  for(var i=0;i<400;i++){
    var key=dt.toISOString().slice(0,10);
    if(days[key] && days[key].plays>0){ n++; dt.setDate(dt.getDate()-1); }
    else if(i===0){ dt.setDate(dt.getDate()-1); } // vandaag nog niet gespeeld → kijk of gisteren telde
    else break;
  }
  return n;
}
function mountStreak(elm){
  if(!elm) return;
  var d=base(load()), days=d.days, n=streakCount(days);
  var html='<div class="mf-h"><span class="mf-fire">🔥</span> Racha: <b>'+n+'</b> día'+(n===1?"":"s")+
    ' <span class="mf-nl">· dagen na elkaar</span></div><div class="mf-cal">';
  var dt; try{ dt=new Date(today()+"T00:00:00"); }catch(e){ dt=null; }
  var cells=[];
  for(var i=13;i>=0;i--){
    var key="—", played=false, lbl="";
    if(dt){ var c=new Date(dt); c.setDate(c.getDate()-i); key=c.toISOString().slice(0,10);
      played=!!(days[key]&&days[key].plays>0); lbl=key.slice(5); }
    cells.push('<span class="mf-day'+(played?" on":"")+(i===0?" today":"")+'" title="'+key+'">'+
      '<i></i><em>'+lbl+'</em></span>');
  }
  html+=cells.join("")+'</div>';
  elm.innerHTML=html;
}

/* --- heatmap: beheersing per tag (groen=sterk, rood=zwak) --- */
function mountHeatmap(elm){
  if(!elm) return;
  var d=base(load()), tags=d.tags, keys=Object.keys(tags);
  if(!keys.length){ elm.innerHTML='<div class="mf-empty">Speel een spel om je beheersing per thema te zien.</div>'; return; }
  keys.sort(function(a,b){ return acc(tags[a])-acc(tags[b]); }); // zwakste eerst
  function acc(g){ var t=g.ok+g.bad; return t? g.ok/t : 0; }
  var rows=keys.slice(0,24).map(function(k){
    var g=tags[k], t=g.ok+g.bad, p=t?Math.round(g.ok/t*100):0;
    var col = p>=80?"#2E8E68": p>=55?"#E0A22F": "#C4402C";
    var name=(g.label||k).replace(/<[^>]+>/g," ").trim();
    return '<div class="mf-hrow"><span class="mf-hl">'+esc(name)+'</span>'+
      '<span class="mf-ht"><span class="mf-hf" style="width:'+p+'%;background:'+col+'"></span></span>'+
      '<span class="mf-hn">'+p+'%</span></div>';
  }).join("");
  elm.innerHTML='<div class="mf-h">Tu dominio por tema <span class="mf-nl">· beheersing per thema</span></div>'+rows;
}

/* --- can-do zelfscan (persistent) --- */
function mountCanDo(elm, items, poolId){
  if(!elm) return;
  items=items||[];
  poolId=poolId||"generic";
  var d=base(load()), store=d.cando;
  var html='<div class="mf-h">Puedo… <span class="mf-nl">· wat kan ik al?</span></div><ul class="mf-cando">';
  items.forEach(function(it,i){
    var id=poolId+":"+(it.id||i);
    var on=!!store[id];
    html+='<li class="mf-ci'+(on?" on":"")+'" data-id="'+esc(id)+'">'+
      '<button type="button" class="mf-cbtn" aria-pressed="'+on+'">'+
      '<span class="mf-cbox">'+(on?"✓":"")+'</span>'+
      '<span class="mf-clbl">'+esc(it.label||String(it))+'</span></button></li>';
  });
  html+='</ul>';
  elm.innerHTML=html;
  elm.querySelectorAll(".mf-ci").forEach(function(li){
    li.querySelector(".mf-cbtn").addEventListener("click",function(){
      var d2=base(load()), id=li.dataset.id, on=!d2.cando[id];
      d2.cando[id]=on; save(d2);
      li.classList.toggle("on",on);
      li.querySelector(".mf-cbox").textContent=on?"✓":"";
      li.querySelector(".mf-cbtn").setAttribute("aria-pressed",on);
    });
  });
}

/* --- Leitner-doosjes: spaced repetition (1=zwak … 5=beheerst) ---
   Herbruikbaar door een template/feeder: kies vaker uit lage doosjes.
   key = stabiele item-identiteit (bv. de stimulus-tekst). */
function Leitner(poolId){
  this.poolId=poolId||"pool";
  var d=base(load());
  this.boxes=(d.leitner[this.poolId]||(d.leitner[this.poolId]={}));
}
Leitner.prototype.box=function(k){ return this.boxes[k]||1; };
Leitner.prototype.promote=function(k){ this.boxes[k]=Math.min(5,(this.boxes[k]||1)+1); this._save(); };
Leitner.prototype.demote=function(k){ this.boxes[k]=1; this._save(); };
Leitner.prototype.register=function(k,ok){ ok?this.promote(k):this.demote(k); };
/* gewicht voor de adaptieve trekking: laag doosje = hoog gewicht (vaker) */
Leitner.prototype.weight=function(k){ return 6-this.box(k); };
Leitner.prototype._save=function(){ var d=base(load()); d.leitner[this.poolId]=this.boxes; save(d); };

function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function reset(){ try{ localStorage.removeItem(KEY); }catch(e){} }

window.MotorFeatures = {
  recordFinish: recordFinish,
  mountStreak: mountStreak,
  mountHeatmap: mountHeatmap,
  mountCanDo: mountCanDo,
  Leitner: Leitner,
  reset: reset,
  _load: load
};
})();

;
/* ============================================================
   MOTOR — gedeelde kern. Sjabloon-onafhankelijk.
   Een sjabloon rendert ALLEEN het speelveld en meldt per beurt
   goed/fout via api.judge(). De motor doet de rest:
   score, streak, niveau, adaptieve keuze, foutenlog, resultaten,
   geluid, instellingen, toegankelijkheid.
   ============================================================ */
(function(){
"use strict";

const CALM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- geluid ---------- */
function makeAudio(on){
  let AC=null;
  function ac(){ if(!AC && on){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
  function beep(f,d,type,vol,to){ if(!on)return; const a=ac(); if(!a)return;
    const o=a.createOscillator(),g=a.createGain(); o.type=type||"triangle";
    o.frequency.setValueAtTime(f,a.currentTime);
    if(to) o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
    g.gain.setValueAtTime(vol||.16,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+d);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d); }
  function noise(d,vol){ if(!on)return; const a=ac(); if(!a)return;
    const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);
    for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource();s.buffer=buf;
    const fl=a.createBiquadFilter();fl.type="lowpass";fl.frequency.value=900;
    const g=a.createGain();g.gain.value=vol||.18;
    s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(); }
  return {
    unlock:ac,
    setOn(v){on=v;},
    ok(){ beep(740,.08,"triangle",.16); setTimeout(()=>beep(1108,.13,"triangle",.14),60); },
    bad(){ noise(.22,.24); beep(150,.28,"sawtooth",.12,70); },
    move(){ beep(620,.04,"square",.05); },
    win(){ [523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>beep(f,.16,"triangle",.15),i*62)); }
  };
}

/* ---------- helpers ---------- */
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function shade(hex,f){ const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,Math.round(((n>>16)&255)*f)));
  const g=Math.max(0,Math.min(255,Math.round(((n>>8)&255)*f)));
  const b=Math.max(0,Math.min(255,Math.round((n&255)*f)));
  return "rgb("+r+","+g+","+b+")"; }

/* ---------- adaptieve toevoer ----------
   Trekt K kandidaten en kiest die met de zwakste tag. Werkt zowel voor
   generatoren (source.make) als voor vaste itemlijsten (source.items). */
function makeFeeder(source, tagStats){
  const draw = source.make ? source.make
             : () => source.items[(Math.random()*source.items.length)|0];
  return function next(){
    let best=null, bestScore=Infinity;
    for(let i=0;i<4;i++){
      const it = draw();
      const st = tagStats[it.tag] || {ok:0,bad:0};
      const acc = (st.ok+1)/(st.ok+st.bad+2);      // laag = zwak → voorrang
      const score = acc + Math.random()*0.5;
      if(score<bestScore){ bestScore=score; best=it; }
    }
    return best;
  };
}

/* ============================================================
   MOUNT
   ============================================================ */
function mount(app, cfg){
  cfg.options = cfg.options || {};
  const audio = makeAudio(cfg.options.audio !== false);

  /* ---- schil bouwen ---- */
  app.innerHTML = "";
  const header = el("header","mt");
  const titleWrap = el("div");
  titleWrap.appendChild(el("h1",null, esc(cfg.title||"Oefening")));
  if(cfg.subtitle) titleWrap.appendChild(el("p","tag", esc(cfg.subtitle)));
  header.appendChild(titleWrap);
  header.appendChild(el("div","sp"));
  const bAgain = el("button","mt-btn","Opnieuw"); bAgain.type="button";
  header.appendChild(bAgain);
  /* confidence-betting (opt-in): ×2 punten én ×2 straf wanneer je zeker bent */
  let bBet=null;
  if(cfg.options.confidence){
    bBet=el("button","mt-btn bet","🎲 ×1"); bBet.type="button";
    bBet.title="Apuesta: dobla los puntos… y el riesgo";
    header.appendChild(bBet);
  }
  app.appendChild(header);

  const wrap = el("div","mt-wrap");
  const fieldCol = el("div");
  const field = el("div","mt-field");
  fieldCol.appendChild(field);
  wrap.appendChild(fieldCol);

  const panel = el("div","mt-panel");
  const sScore = statBox(panel,"Punten","0");
  const sStreak = statBox(panel,"Reeks","0");
  const sProg = statBox(panel,"Voortgang","–");
  wrap.appendChild(panel);
  app.appendChild(wrap);

  /* ---- resultatenoverlay ---- */
  const ov = el("div","mt-ov");
  ov.innerHTML =
    '<div class="mt-sheet"><h2>Klaar</h2><p class="sub" id="mtRSub"></p>'+
    '<div class="mt-rgrid">'+
      '<div class="mt-rcell"><div class="rk">Punten</div><div class="rv" id="mtRScore">0</div></div>'+
      '<div class="mt-rcell"><div class="rk">Juist</div><div class="rv" id="mtRAcc">–</div></div>'+
      '<div class="mt-rcell"><div class="rk">Beste reeks</div><div class="rv" id="mtRBest">0</div></div>'+
    '</div>'+
    '<div class="mt-grp" id="mtRBarsWrap"><label id="mtRBarsLbl">Per categorie</label><div id="mtRBars"></div></div>'+
    '<div class="mt-grp" id="mtRMisWrap"><label>Waar het misging</label><ul class="mt-mis" id="mtRMis"></ul></div>'+
    '<button class="mt-go" id="mtRAgain" type="button">Opnieuw</button></div>';
  app.appendChild(ov);

  /* ---- staat ---- */
  const S = { score:0, streak:0, best:0, level:1, ok:0, total:0, tagStats:{}, log:[], done:0, target:0, bet:1 };
  if(bBet){ bBet.addEventListener("click", ()=>{
    S.bet = S.bet===1 ? 2 : 1;
    bBet.textContent = "🎲 ×"+S.bet; bBet.classList.toggle("on", S.bet===2);
    audio.move();
  }); }

  function statBox(parent,k,v){
    const b=el("div","mt-stat"); b.innerHTML='<span class="k">'+k+'</span><span class="v">'+v+'</span>';
    parent.appendChild(b); return b.querySelector(".v");
  }
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function hud(){
    sScore.textContent=S.score;
    sStreak.textContent=S.streak; sStreak.classList.toggle("hot",S.streak>=5);
    sProg.textContent = S.target ? (S.done+"/"+S.target) : "–";
  }

  /* label voor een tag (categorie of persoon) t.b.v. resultaten */
  function tagLabel(tag){
    if(cfg._tagLabel){ const l=cfg._tagLabel(tag); if(l) return l; }
    if(cfg.classify && cfg.classify.categories){
      const c=cfg.classify.categories.find(x=>x.id===tag); if(c) return c.label.replace(/<[^>]+>/g," ").trim();
    }
    return tag;
  }

  /* ---- API voor het sjabloon ---- */
  const feeder = cfg._source ? makeFeeder(cfg._source, S.tagStats) : null;

  const api = {
    root: field,
    config: cfg,
    calm: CALM,
    sfx: audio,
    el, shade,
    categories: (cfg.classify && cfg.classify.categories) || [],

    /* volgende stimulus (adaptief) — enkel voor stimulus→antwoord-sjablonen */
    next(){ return feeder ? feeder() : null; },

    /* aantal beurten instellen (voor voortgang + einde) */
    setTarget(n){ S.target=n; hud(); },
    tick(){ S.done++; hud(); },

    /* losse puntenbonus (bv. tetris-lijn); telt niet mee in juist% */
    bonus(n){ S.score += (n|0); hud(); },

    /* kern: één beoordeling. meta = {tag, stimulus, chosen, correct[], sub} */
    judge(ok, meta){
      meta = meta || {};
      S.total++;
      const tag = meta.tag || "_";
      const st = S.tagStats[tag] || (S.tagStats[tag]={ok:0,bad:0});
      const bet = S.bet||1;
      if(ok){
        S.ok++; st.ok++; S.streak++; if(S.streak>S.best)S.best=S.streak;
        S.score += (10 + Math.min(50,S.streak*3)) * bet;
        if(S.ok % 10 === 0) S.level++;
        audio.ok();
      }else{
        st.bad++; S.streak=0; S.score=Math.max(0,S.score-5*bet);
        audio.bad();
        if(meta.stimulus){
          S.log.push({ stimulus:meta.stimulus, sub:meta.sub||"",
            juist:(meta.correct||[]).map(tagLabel).join(" / "),
            gekozen: meta.chosen!=null ? tagLabel(meta.chosen) : "" });
        }
      }
      hud();
      return { ok, streak:S.streak };
    },

    finish(){ showResults(); }
  };

  function showResults(){
    const acc = S.total ? Math.round(S.ok/S.total*100) : 0;
    ov.querySelector("#mtRScore").textContent=S.score;
    ov.querySelector("#mtRAcc").textContent=acc+"%";
    ov.querySelector("#mtRBest").textContent=S.best;
    ov.querySelector("#mtRSub").textContent =
      acc>=90 ? "Strak werk." : acc>=70 ? "Degelijk." : "Nog eens oefenen loont.";

    /* balken per tag (alleen tonen als er >1 tag is) */
    const tags = Object.keys(S.tagStats);
    const barsWrap = ov.querySelector("#mtRBarsWrap");
    const bars = ov.querySelector("#mtRBars"); bars.innerHTML="";
    if(tags.length>1){
      barsWrap.style.display="";
      const palette=["#C4402C","#E0A22F","#2E8E68","#3D74D6","#8B5E9E","#6E6249"];
      tags.forEach((t,i)=>{
        const s=S.tagStats[t], tot=s.ok+s.bad, pct=tot?Math.round(s.ok/tot*100):0;
        const row=el("div","mt-bar");
        row.innerHTML='<span class="bl">'+esc(tagLabel(t))+'</span>'+
          '<span class="bt"><span class="bf" style="width:'+pct+'%;background:'+palette[i%palette.length]+'"></span></span>'+
          '<span class="bn">'+pct+'%</span>';
        bars.appendChild(row);
      });
    } else barsWrap.style.display="none";

    /* laatste fouten */
    const misWrap=ov.querySelector("#mtRMisWrap");
    const ul=ov.querySelector("#mtRMis"); ul.innerHTML="";
    const last=S.log.slice(-8).reverse();
    misWrap.style.display = last.length ? "" : "none";
    last.forEach(m=>{
      const li=el("li");
      li.innerHTML="<b>"+esc(m.stimulus)+"</b> <span class='ok'>"+esc(m.juist)+"</span>"+
        (m.gekozen?" <em>jij: "+esc(m.gekozen)+"</em>":"")+
        (m.sub?" <span style='color:#8A7F66;font-size:12px'>("+esc(m.sub)+")</span>":"");
      ul.appendChild(li);
    });
    if(acc>=90) audio.win();
    ov.classList.add("on");

    /* meta-laag: voortgang persisteren (streak · heatmap · spellen) */
    if(window.MotorFeatures && window.MotorFeatures.recordFinish){
      const tagLabels={}; Object.keys(S.tagStats).forEach(t=>{ tagLabels[t]=tagLabel(t); });
      window.MotorFeatures.recordFinish({
        id: cfg.id,
        title: String(cfg.title||"").replace(/<[^>]+>/g,"").trim(),
        ok: S.ok, total: S.total, tagStats: S.tagStats, tagLabels: tagLabels
      });
    }
  }

  /* ---- start / herstart ---- */
  function reset(){
    S.score=0;S.streak=0;S.best=0;S.level=1;S.ok=0;S.total=0;S.tagStats={};S.log=[];S.done=0;S.target=0;
    if(api._cleanup){ api._cleanup(); api._cleanup=null; }
    ov.classList.remove("on"); field.innerHTML=""; hud();
    const tpl = window.MotorTemplates && window.MotorTemplates[cfg.template];
    if(!tpl){ field.innerHTML="<p style='color:#C4402C'>Onbekend sjabloon: "+esc(cfg.template)+"</p>"; return; }
    tpl.init(api);
  }
  bAgain.addEventListener("click", ()=>{ audio.unlock(); reset(); });
  ov.querySelector("#mtRAgain").addEventListener("click", ()=>{ audio.unlock(); reset(); });

  /* eerste tik ontgrendelt geluid op mobiel */
  app.addEventListener("pointerdown", ()=>audio.unlock(), {once:true});

  reset();
}

window.Motor = { mount };
})();

;
(function(){
var cfg = {"id":"es-u4-presente-tetris","title":"Presente regular","subtitle":"U4 · laat de vorm in de juiste persoon vallen (actividades)","lang":"es","template":"tetris","options":{"rows":9,"speed":1250,"audio":false},"generator":{"kind":"conjugation","tense":"pres","pool":"reg","persons":["yo","tu","el","nos","vos","ellos"]},"classify":{"categories":[{"id":"yo","label":"yo","glaze":"#C4402C"},{"id":"tu","label":"tú","glaze":"#E0A22F"},{"id":"el","label":"él/ella","glaze":"#2E8E68"},{"id":"nos","label":"nosotros","glaze":"#3D74D6"},{"id":"vos","label":"vosotros","glaze":"#8B5E9E"},{"id":"ellos","label":"ellos","glaze":"#2FA8A0"}]}};
cfg._source = window.MotorGen['conjugation']({"kind":"conjugation","tense":"pres","pool":"reg","persons":["yo","tu","el","nos","vos","ellos"]});
cfg._tagLabel = cfg._source.tagLabel;
Motor.mount(document.getElementById('app'), cfg);
})();
